name: T026 Covertype Meta Resolution
on:
  workflow_dispatch:
  push:
    paths:
      - experiments/T026_covtype_meta_resolution.py
      - .github/workflows/t026_covtype.yml
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install -q numpy scikit-learn
      - run: python experiments/T026_covtype_meta_resolution.py
      - uses: actions/upload-artifact@v4
        with: {name: T026-results, path: T026_summary.json}
