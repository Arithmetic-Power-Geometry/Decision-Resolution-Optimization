name: T020 ECD Collision
on:
  workflow_dispatch:
  push:
    paths:
      - tests/T020_ec2_collision.py
      - .github/workflows/t020_ec2.yml
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python tests/T020_ec2_collision.py
      - uses: actions/upload-artifact@v4
        with:
          name: T020-results
          path: T020_summary.json
