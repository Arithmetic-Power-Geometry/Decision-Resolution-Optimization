name: T018 PhysioNet Sequential Reversal
on:
  workflow_dispatch:
  push:
    paths:
      - 'experiments/T018_physionet_sequential_reversal.py'
      - '.github/workflows/t018_physionet.yml'
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy pandas scikit-learn
      - run: python experiments/T018_physionet_sequential_reversal.py
      - uses: actions/upload-artifact@v4
        with:
          name: T018-results
          path: |
            T018_summary.json
            T018_cases.csv

# rerun after outcome-parser fix
