name: T008 PhysioNet real-data benchmark
on:
  push:
    paths:
      - 'experiments/T008_physionet_realdata.py'
      - '.github/workflows/t008_physionet.yml'
  workflow_dispatch:
jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy pandas scikit-learn
      - run: python experiments/T008_physionet_realdata.py
      - uses: actions/upload-artifact@v4
        with:
          name: T008-physionet-results
          path: results/T008_physionet_*
