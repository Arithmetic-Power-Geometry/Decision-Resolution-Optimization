name: T027 NHANES Replication Gate
on:
  workflow_dispatch:
  push:
    paths: [experiments/T027_nhanes_replication.py, .github/workflows/t027_nhanes.yml]
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install -q numpy pandas scipy scikit-learn
      - run: python experiments/T027_nhanes_replication.py
      - uses: actions/upload-artifact@v4
        with: {name: T027-results, path: T027_summary.json}
