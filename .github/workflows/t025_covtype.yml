name: T025 Covertype Resolver Choice
on:
  workflow_dispatch:
  push:
    paths:
      - experiments/T025_covtype_resolver_choice.py
      - .github/workflows/t025_covtype.yml
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -q numpy scikit-learn
      - run: python experiments/T025_covtype_resolver_choice.py
      - uses: actions/upload-artifact@v4
        with:
          name: T025-results
          path: T025_summary.json
